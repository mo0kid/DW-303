function edge(button,pressed){const key=bindings[button.id]||button.id;if(pressed){if(held.has(button))return;if(key==='pitch-mode')editMode=1;if(key==='time-mode')editMode=2;if(key==='function'||key==='run-stop')editMode=0;let sent=key;if(held.has(document.getElementById('key-down'))){if(key==='key-down')sent='key-step';if(key==='key-up')sent='key-triplet';}if(editMode===0&&!held.has(document.getElementById('key-down'))&&(key==='key-accent'||key==='key-slide'))window.panel({action:'section',value:key==='key-accent'?0:1});held.set(button,sent);window.panel({action:'button',key:sent,edge:'press'});}else{const sent=held.get(button);if(!sent)return;held.delete(button);window.panel({action:'button',key:sent,edge:'release'});}}
for(const button of document.querySelectorAll('.hit')){const key=bindings[button.id]||button.id;if(labels[key]){button.setAttribute('aria-label',labels[key]);button.title=labels[key];}button.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();button.setPointerCapture(e.pointerId);edge(button,true);});for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,()=>edge(button,false));button.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();suppressClick=true;if(!e.repeat)edge(button,true);}});button.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();edge(button,false);setTimeout(()=>suppressClick=false,0);}});button.addEventListener('blur',()=>edge(button,false));button.addEventListener('click',e=>{e.preventDefault();if(e.detail===0&&!suppressClick&&!held.has(button)){edge(button,true);edge(button,false);}});}
addEventListener('blur',()=>{for(const button of [...held.keys()])edge(button,false);});
function paintLeds(){const phase=Math.floor(performance.now()/200)%2===0;for(const led of document.querySelectorAll('.led')){const value=logicalLeds[led.id.slice(4)]||0;led.dataset.on=String(Number(value===1||value===true||(value===2&&phase)));}}
setInterval(paintLeds,50);
window.ravetUpdate=state=>{if(!state||typeof state!=='object')return;for(const [id,control] of controls){const value=state.params?.[id];if(Number.isFinite(value))control.update(id===9?value===1:value);}if(Number.isFinite(state.params?.[12])){run=state.params[12];document.getElementById('run-stop').setAttribute('aria-pressed',String(run===1));}logicalLeds=state.leds||{};paintLeds();if(state.selection){selection=state.selection;editMode=selection.editMode||0;selectors.get('mode')?.update(selection.mode);selectors.get('pattern-group')?.update(selection.track);}const modes=['Track Write','Track Play','Pattern Play','Pattern Write'];status.textContent=state.error||(state.pending?'Awaiting host…':[selection?`${modes[selection.mode]} · ${['I','II','III','IV'][selection.group]}${selection.section} pattern ${selection.pattern} · step ${selection.step}`:'',typeof state.status==='string'?state.status:''].filter(Boolean).join(' · '));status.dataset.error=String(Boolean(state.error));};
</script></body></html>
